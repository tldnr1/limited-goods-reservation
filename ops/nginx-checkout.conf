events { worker_connections 512; }
http {
  upstream reservation { server reservation:8080; keepalive 8; }
  upstream payment { server payment:8080; keepalive 8; }
  server {
    listen 80;
    client_max_body_size 8k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 1s;
    proxy_read_timeout 6s;
    proxy_next_upstream off;
    location /api/purchases { proxy_pass http://reservation; }
    # Local fixture / inspection endpoints; not a public admin authorization mechanism.
    location /api/sales { proxy_pass http://reservation; }
    location /api/orders { proxy_pass http://payment; }
    location /api/payments { proxy_pass http://payment; }
    location / { return 404; }
  }
}
