events { worker_connections 2048; }
http {
  upstream goods {
    server api1:8080;
    server api2:8080;
    keepalive 32;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://goods;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 1s;
      proxy_read_timeout 6s;
      proxy_next_upstream off;
    }
    location /actuator { deny all; }
  }
}
