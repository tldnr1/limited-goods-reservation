events { worker_connections 2048; }
http {
  log_format timings escape=json '{"time":"$time_iso8601","msec":"$msec",'
    '"request_id":"$request_id","method":"$request_method","uri":"$uri",'
    '"status":$status,"request_time":"$request_time","upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status","connect_time":"$upstream_connect_time",'
    '"header_time":"$upstream_header_time","response_time":"$upstream_response_time"}';
  access_log /dev/stdout timings;
  upstream goods {
    server api1:8080;
    server api2:8080;
    keepalive 32;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://goods;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 1s;
      proxy_read_timeout 6s;
      proxy_next_upstream off;
    }
    location /actuator { deny all; }
  }
}
