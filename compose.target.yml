# Target v1 overlay. The baseline compose and its historical performance harness remain available.
services:
  api1:
    environment:
      SPRING_PROFILES_ACTIVE: waiting
      HTTP_THREADS: 24
      HTTP_CONNECTIONS: 256
    depends_on: !override
      redis:
        condition: service_healthy
    cpus: 0.375
    mem_limit: 384m
  api2:
    environment:
      SPRING_PROFILES_ACTIVE: waiting
      HTTP_THREADS: 24
      HTTP_CONNECTIONS: 256
    depends_on: !override
      redis:
        condition: service_healthy
    cpus: 0.375
    mem_limit: 384m
  reservation:
    extends:
      file: compose.yaml
      service: api1
    environment:
      SPRING_PROFILES_ACTIVE: reservation
      APP_INSTANCE: reservation
      DB_POOL_SIZE: 4
      HTTP_THREADS: 16
      HTTP_CONNECTIONS: 64
      HTTP_BACKLOG: 16
    cpus: 0.5
    mem_limit: 512m
  payment:
    extends:
      file: compose.yaml
      service: api1
    environment:
      SPRING_PROFILES_ACTIVE: payment
      APP_INSTANCE: payment
      DB_POOL_SIZE: 4
      HTTP_THREADS: 16
      HTTP_CONNECTIONS: 64
      HTTP_BACKLOG: 16
    depends_on: !override
      postgres:
        condition: service_healthy
      reservation:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 384m
  worker:
    environment:
      SPRING_PROFILES_ACTIVE: worker
      WORKER_CONCURRENCY: 4
    depends_on: !override
      postgres:
        condition: service_healthy
      mock-pg:
        condition: service_healthy
      reservation:
        condition: service_healthy
  mock-pg:
    depends_on: !override
      postgres:
        condition: service_healthy
    mem_limit: 384m
  nginx:
    volumes: !override
      - ./ops/nginx-waiting.conf:/etc/nginx/nginx.conf:ro
    depends_on: !override
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    cpus: 0.125
    mem_limit: 64m
  checkout-nginx:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8082:80"]
    volumes: ["./ops/nginx-checkout.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      reservation:
        condition: service_healthy
      payment:
        condition: service_healthy
      worker:
        condition: service_healthy
    cpus: 0.125
    mem_limit: 64m
