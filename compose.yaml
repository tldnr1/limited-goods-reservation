name: limited-goods-java
x-app: &app
  image: limited-goods-java:local
  build: .
  restart: "no"
  environment: &env
    DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-limited_goods_dev}
    DB_USER: goods
    DB_PASSWORD: local-only
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_NAMESPACE: "goods:${APP_ENV:-dev}:"
    ADMISSION_ENABLED: "${ADMISSION_ENABLED:-false}"
    PG_URL: http://mock-pg:8080
    PG_SECRET: local-pg-secret
    DB_POOL_SIZE: 8
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  cpus: 0.75
  mem_limit: 768m
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: goods
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: limited_goods_dev
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - java-postgres:/var/lib/postgresql/data
      - ./ops/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U goods -d limited_goods_dev"]
      interval: 2s
      timeout: 2s
      retries: 30
    cpus: 1.5
    mem_limit: 1536m
  redis:
    image: redis:7-alpine
    command: ["redis-server","--maxmemory","192mb","--maxmemory-policy","noeviction"]
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    cpus: 0.25
    mem_limit: 256m
  api1:
    <<: *app
  api2:
    <<: *app
  worker:
    <<: *app
    environment:
      <<: *env
      WORKER_ENABLED: "true"
      DB_POOL_SIZE: 4
    cpus: 0.5
    mem_limit: 512m
  mock-pg:
    <<: *app
    environment:
      <<: *env
      SPRING_PROFILES_ACTIVE: mockpg
      DB_POOL_SIZE: 2
    cpus: 0.25
    mem_limit: 512m
  nginx:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./ops/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [api1,api2]
    cpus: 0.25
    mem_limit: 128m
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observe]
    volumes: ["./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    cpus: 0.25
    mem_limit: 256m
volumes:
  java-postgres:
