services:
  api:
    build:
      context: .
    container_name: limited-goods-api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/limited_goods_reservation
      SPRING_DATASOURCE_USERNAME: limited_goods
      SPRING_DATASOURCE_PASSWORD: limited_goods
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      STOCK_STRATEGY: ${STOCK_STRATEGY:-naive-rdb}
      PURCHASE_ARCHITECTURE: ${PURCHASE_ARCHITECTURE:-}
      PURCHASE_FAILURE_MODE: ${PURCHASE_FAILURE_MODE:-off}
      PURCHASE_FAILURE_LIMIT: ${PURCHASE_FAILURE_LIMIT:-0}
      WAITING_ROOM_ENABLED: ${WAITING_ROOM_ENABLED:-true}
      WAITING_ROOM_PRODUCT_ID: ${WAITING_ROOM_PRODUCT_ID:-1}
      WAITING_ROOM_ADMISSION_SCHEDULER_ENABLED: ${WAITING_ROOM_ADMISSION_SCHEDULER_ENABLED:-true}
      WAITING_ROOM_ADMISSION_BATCH_SIZE: ${WAITING_ROOM_ADMISSION_BATCH_SIZE:-20}
      WAITING_ROOM_ADMISSION_ACTIVE_CAPACITY: ${WAITING_ROOM_ADMISSION_ACTIVE_CAPACITY:-100}
      WAITING_ROOM_ACTIVE_TOKEN_TTL_SECONDS: ${WAITING_ROOM_ACTIVE_TOKEN_TTL_SECONDS:-60}
      WAITING_ROOM_ADMISSION_INTERVAL_MS: ${WAITING_ROOM_ADMISSION_INTERVAL_MS:-1000}
      WAITING_ROOM_RETRY_AFTER_SECONDS: ${WAITING_ROOM_RETRY_AFTER_SECONDS:-2}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: limited-goods-postgres
    environment:
      POSTGRES_DB: limited_goods_reservation
      POSTGRES_USER: limited_goods
      POSTGRES_PASSWORD: limited_goods
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limited_goods -d limited_goods_reservation"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: limited-goods-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: limited-goods-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.0
    container_name: limited-goods-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      prometheus:
        condition: service_healthy

  k6:
    image: grafana/k6:0.54.0
    container_name: limited-goods-k6
    profiles:
      - load-test
    environment:
      BASE_URL: http://api:8080
      STOCK_STRATEGY: ${STOCK_STRATEGY:-naive-rdb}
      PURCHASE_ARCHITECTURE: ${PURCHASE_ARCHITECTURE:-}
      PRODUCT_ID: ${PRODUCT_ID:-1}
      VUS: ${VUS:-1000}
      ITERATIONS: ${ITERATIONS:-1000}
      MAX_DURATION: ${MAX_DURATION:-2m}
      RUN_ID: ${RUN_ID:-local}
      REPEAT: ${REPEAT:-1}
      INITIAL_STOCK: ${INITIAL_STOCK:-100}
      ADMISSION_POLICY: ${ADMISSION_POLICY:-unknown}
      MAX_POLLS: ${MAX_POLLS:-30}
      PRE_PURCHASE_SLEEP_SECONDS: ${PRE_PURCHASE_SLEEP_SECONDS:-0}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99),min,max,avg
    volumes:
      - ./k6:/scripts:ro
      - ${K6_RESULTS_DIR:-./notes/v2-stock-strategy/raw}:/results
    command: ["run", "-o", "experimental-prometheus-rw", "${K6_SCRIPT:-/scripts/v2/stock-strategy-baseline.js}"]
    depends_on:
      api:
        condition: service_started
      prometheus:
        condition: service_healthy

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
