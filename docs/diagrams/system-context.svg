<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Limited Goods 시스템 컨텍스트</title>
  <desc id="desc">판매자는 한정 판매를 설정하고 구매자는 조회와 구매를 수행한다. 운영자는 결과 미확정 상태를 관찰하며 Limited Goods는 Mock PG와 결제 요청과 결과를 주고받는다.</desc>
  <defs>
    <style>
      :root { color-scheme: light dark; }
      .bg { fill: #f8fafc; }
      .title { fill: #0f172a; font: 700 30px "Malgun Gothic", system-ui, sans-serif; }
      .subtitle { fill: #475569; font: 400 15px "Malgun Gothic", system-ui, sans-serif; }
      .external { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .system { fill: #0f766e; stroke: #115e59; stroke-width: 3; }
      .name { fill: #0f172a; font: 700 19px "Malgun Gothic", system-ui, sans-serif; }
      .copy { fill: #475569; font: 400 14px "Malgun Gothic", system-ui, sans-serif; }
      .system-name { fill: #ffffff; font: 700 24px "Malgun Gothic", system-ui, sans-serif; }
      .system-copy { fill: #ccfbf1; font: 400 15px "Malgun Gothic", system-ui, sans-serif; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-label { fill: #334155; font: 500 13px "Malgun Gothic", system-ui, sans-serif; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0f172a; }
        .title, .name { fill: #f8fafc; }
        .subtitle, .copy { fill: #cbd5e1; }
        .external { fill: #1e293b; stroke: #64748b; }
        .system { fill: #115e59; stroke: #2dd4bf; }
        .arrow { stroke: #94a3b8; }
        .edge-label { fill: #e2e8f0; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="56" y="58">시스템 컨텍스트</text>
  <text class="subtitle" x="56" y="86">한정 상품 구매 경계와 상호작용하는 참여자</text>

  <rect class="external" x="60" y="130" width="240" height="130" rx="14"/>
  <text class="name" x="180" y="171" text-anchor="middle">판매자</text>
  <text class="copy" x="180" y="201" text-anchor="middle">판매 시각과 재고를 설정</text>
  <text class="copy" x="180" y="223" text-anchor="middle">가격과 인당 제한을 설정</text>

  <rect class="external" x="60" y="315" width="240" height="130" rx="14"/>
  <text class="name" x="180" y="356" text-anchor="middle">구매자</text>
  <text class="copy" x="180" y="386" text-anchor="middle">상품을 조회하고 점유한 뒤</text>
  <text class="copy" x="180" y="408" text-anchor="middle">결제를 시도</text>

  <rect class="external" x="60" y="500" width="240" height="130" rx="14"/>
  <text class="name" x="180" y="541" text-anchor="middle">운영자</text>
  <text class="copy" x="180" y="571" text-anchor="middle">실패와 결제 결과</text>
  <text class="copy" x="180" y="593" text-anchor="middle">미확정 상태를 관찰</text>

  <rect class="system" x="430" y="220" width="360" height="300" rx="20"/>
  <text class="system-name" x="610" y="282" text-anchor="middle">Limited Goods</text>
  <text class="system-copy" x="610" y="322" text-anchor="middle">판매 시각과 인당 제한을 검증</text>
  <text class="system-copy" x="610" y="350" text-anchor="middle">여러 상품의 재고를 원자적으로 점유</text>
  <text class="system-copy" x="610" y="378" text-anchor="middle">주문과 결제 상태를 조정</text>
  <text class="system-copy" x="610" y="406" text-anchor="middle">점유를 만료하거나 구매를 확정</text>
  <text class="system-copy" x="610" y="460" text-anchor="middle">초기 버전: Python 모듈러 모놀리스</text>

  <rect class="external" x="900" y="300" width="240" height="150" rx="14"/>
  <text class="name" x="1020" y="344" text-anchor="middle">Mock PG</text>
  <text class="copy" x="1020" y="375" text-anchor="middle">성공·실패·지연과</text>
  <text class="copy" x="1020" y="397" text-anchor="middle">중복 결과를 재현</text>
  <text class="copy" x="1020" y="421" text-anchor="middle">실제 금액은 결제하지 않음</text>

  <path class="arrow" d="M 300 195 C 360 195, 370 265, 430 285"/>
  <text class="edge-label" x="328" y="193">판매 설정</text>

  <path class="arrow" d="M 300 380 L 430 380"/>
  <text class="edge-label" x="318" y="363">조회와 구매</text>

  <path class="arrow" d="M 430 475 C 370 500, 360 560, 300 565"/>
  <text class="edge-label" x="322" y="536">로그·메트릭·알림</text>

  <path class="arrow" d="M 790 360 L 900 360"/>
  <text class="edge-label" x="806" y="343">결제 요청</text>

  <path class="arrow" d="M 900 410 C 855 455, 830 450, 790 430"/>
  <text class="edge-label" x="817" y="476">결과 / 콜백</text>
</svg>
