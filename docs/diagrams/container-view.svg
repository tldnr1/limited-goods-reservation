<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">Limited Goods Local Baseline 실행 구성</title>
  <desc id="desc">한 로컬 호스트의 Docker Compose 안에서 FastAPI, Worker, PostgreSQL, Mock PG와 Prometheus가 실행된다. API와 Worker는 PostgreSQL을 공유하고 Mock PG와 통신하며 Prometheus는 API 메트릭만 수집한다.</desc>
  <defs>
    <style>
      :root { color-scheme: light dark; }
      .bg { fill: #f8fafc; }
      .host { fill: #f1f5f9; stroke: #475569; stroke-width: 2; }
      .compose { fill: #ffffff; stroke: #64748b; stroke-width: 2; stroke-dasharray: 9 7; }
      .external { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .app { fill: #ecfeff; stroke: #0f766e; stroke-width: 2.5; }
      .data { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
      .provider { fill: #fff7ed; stroke: #c2410c; stroke-width: 2.3; }
      .observe { fill: #faf5ff; stroke: #7e22ce; stroke-width: 2.3; }
      .title { fill: #0f172a; font: 700 30px "Malgun Gothic", system-ui, sans-serif; }
      .subtitle { fill: #475569; font: 400 15px "Malgun Gothic", system-ui, sans-serif; }
      .boundary-title { fill: #334155; font: 700 16px "Malgun Gothic", system-ui, sans-serif; }
      .name { fill: #0f172a; font: 700 18px "Malgun Gothic", system-ui, sans-serif; }
      .tech { fill: #0f766e; font: 600 13px "Malgun Gothic", system-ui, sans-serif; }
      .copy { fill: #475569; font: 400 13px "Malgun Gothic", system-ui, sans-serif; }
      .note { fill: #475569; font: 500 12px "Malgun Gothic", system-ui, sans-serif; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-label { fill: #334155; font: 600 12px "Malgun Gothic", system-ui, sans-serif; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0f172a; }
        .host { fill: #111827; stroke: #94a3b8; }
        .compose { fill: #1e293b; stroke: #94a3b8; }
        .external { fill: #1e293b; stroke: #64748b; }
        .app { fill: #134e4a; stroke: #2dd4bf; }
        .data { fill: #172554; stroke: #60a5fa; }
        .provider { fill: #431407; stroke: #fb923c; }
        .observe { fill: #3b0764; stroke: #c084fc; }
        .title, .name { fill: #f8fafc; }
        .subtitle, .boundary-title, .copy, .note, .edge-label { fill: #cbd5e1; }
        .tech { fill: #5eead4; }
        .arrow { stroke: #94a3b8; }
        .edge-label { stroke: #0f172a; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="850"/>
  <text class="title" x="45" y="54">Local Baseline · 실행 구성</text>
  <text class="subtitle" x="45" y="82">현재 Docker Compose의 실행 단위와 실제 통신만 표시</text>

  <rect class="host" x="220" y="105" width="1330" height="690" rx="18"/>
  <text class="boundary-title" x="245" y="137">개발자 로컬 호스트 · 단일 머신</text>
  <rect class="compose" x="260" y="160" width="1245" height="600" rx="16"/>
  <text class="boundary-title" x="285" y="192">Docker Compose · limited-goods-next</text>

  <path class="arrow" d="M195 350 H340"/>
  <text class="edge-label" x="228" y="333">HTTP / JSON</text>
  <path class="arrow" d="M660 310 H800"/>
  <text class="edge-label" x="686" y="292">SQL transaction</text>
  <path class="arrow" d="M660 630 C725 630 730 420 800 380"/>
  <text class="edge-label" x="684" y="516">polling · row lock</text>
  <path class="arrow" d="M660 260 C830 195 1085 195 1190 280"/>
  <text class="edge-label" x="858" y="213">POST /payments</text>
  <path class="arrow" d="M1190 385 C1040 500 790 495 660 385"/>
  <text class="edge-label" x="855" y="495">POST /internal/payments/callback</text>
  <path class="arrow" d="M660 700 C700 700 700 735 740 735 H1470 V330 H1440"/>
  <text class="edge-label" x="1160" y="752">GET payment status</text>
  <path class="arrow" d="M800 620 C740 600 715 445 660 400"/>
  <text class="edge-label" x="675" y="565">scrape /metrics · 5s</text>

  <rect class="external" x="30" y="245" width="165" height="210" rx="13"/>
  <text class="name" x="112" y="286" text-anchor="middle">API 사용자</text>
  <text class="copy" x="112" y="320" text-anchor="middle">판매자</text>
  <text class="copy" x="112" y="344" text-anchor="middle">구매자</text>
  <text class="copy" x="112" y="382" text-anchor="middle">브라우저 UI 없음</text>
  <text class="copy" x="112" y="406" text-anchor="middle">OpenAPI / HTTP 호출</text>
  <text class="copy" x="112" y="430" text-anchor="middle">X-User-Id는 임시 경계</text>

  <rect class="app" x="340" y="220" width="320" height="215" rx="15"/>
  <text class="name" x="500" y="260" text-anchor="middle">API</text>
  <text class="tech" x="500" y="286" text-anchor="middle">FastAPI · Uvicorn · :8000</text>
  <text class="copy" x="500" y="320" text-anchor="middle">조회 · 구매 · 결제 시작</text>
  <text class="copy" x="500" y="344" text-anchor="middle">Mock PG callback · 상태 확인</text>
  <text class="copy" x="500" y="378" text-anchor="middle">sales · purchases</text>
  <text class="copy" x="500" y="400" text-anchor="middle">reservations · payments</text>
  <text class="note" x="500" y="422" text-anchor="middle">구조화 로그 → stdout</text>

  <rect class="app" x="340" y="570" width="320" height="165" rx="15"/>
  <text class="name" x="500" y="610" text-anchor="middle">Worker</text>
  <text class="tech" x="500" y="636" text-anchor="middle">동일 Python 코드베이스 · 1s polling</text>
  <text class="copy" x="500" y="670" text-anchor="middle">점유 만료</text>
  <text class="copy" x="500" y="693" text-anchor="middle">결제 결과 정합성 확인</text>
  <text class="note" x="500" y="719" text-anchor="middle">구조화 로그 → stdout</text>

  <rect class="data" x="800" y="240" width="290" height="200" rx="15"/>
  <text class="name" x="945" y="280" text-anchor="middle">PostgreSQL</text>
  <text class="tech" x="945" y="306" text-anchor="middle">PostgreSQL 16 · :5434→5432</text>
  <text class="copy" x="945" y="341" text-anchor="middle">유일한 영속 상태 원본</text>
  <text class="copy" x="945" y="365" text-anchor="middle">트랜잭션 · row lock · 제약 조건</text>
  <text class="copy" x="945" y="399" text-anchor="middle">판매 · 재고 · 주문 · 점유 · 결제 시도</text>
  <text class="note" x="945" y="423" text-anchor="middle">API와 Worker가 공유</text>

  <rect class="provider" x="1190" y="240" width="250" height="180" rx="15"/>
  <text class="name" x="1315" y="280" text-anchor="middle">Mock PG</text>
  <text class="tech" x="1315" y="306" text-anchor="middle">FastAPI · Uvicorn · :8080</text>
  <text class="copy" x="1315" y="341" text-anchor="middle">성공 · 실패 · 지연 · 중복</text>
  <text class="copy" x="1315" y="365" text-anchor="middle">결제 생성 · callback · 상태 조회</text>
  <text class="note" x="1315" y="397" text-anchor="middle">상태는 프로세스 메모리</text>

  <rect class="observe" x="800" y="560" width="290" height="150" rx="15"/>
  <text class="name" x="945" y="600" text-anchor="middle">Prometheus</text>
  <text class="tech" x="945" y="626" text-anchor="middle">Prometheus 2.55.1 · :9090</text>
  <text class="copy" x="945" y="661" text-anchor="middle">API /metrics만 수집</text>
  <text class="note" x="945" y="686" text-anchor="middle">dashboard · alert 없음</text>

</svg>
