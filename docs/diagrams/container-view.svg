<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Limited Goods 컨테이너 구성</title>
  <desc id="desc">구매자와 판매자는 API를 사용한다. API와 Worker는 모듈화된 Python 코드베이스와 PostgreSQL을 공유하며 관측 데이터를 남긴다. 결제 요청과 정합성 확인은 Mock PG 경계를 통과한다.</desc>
  <defs>
    <style>
      :root { color-scheme: light dark; }
      .bg { fill: #f8fafc; }
      .boundary { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 9 7; }
      .external { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .container { fill: #e6fffb; stroke: #0f766e; stroke-width: 2.4; }
      .data { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.4; }
      .support { fill: #faf5ff; stroke: #7e22ce; stroke-width: 2.2; }
      .title { fill: #0f172a; font: 700 30px "Malgun Gothic", system-ui, sans-serif; }
      .boundary-title { fill: #334155; font: 700 16px "Malgun Gothic", system-ui, sans-serif; }
      .name { fill: #0f172a; font: 700 18px "Malgun Gothic", system-ui, sans-serif; }
      .tech { fill: #0f766e; font: 600 13px "Malgun Gothic", system-ui, sans-serif; }
      .copy { fill: #475569; font: 400 13px "Malgun Gothic", system-ui, sans-serif; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .arrow-both { fill: none; stroke: #64748b; stroke-width: 2; marker-start: url(#arrow-start); marker-end: url(#arrow); }
      .edge-label { fill: #334155; font: 500 12px "Malgun Gothic", system-ui, sans-serif; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0f172a; }
        .boundary { stroke: #94a3b8; }
        .external { fill: #1e293b; stroke: #64748b; }
        .container { fill: #134e4a; stroke: #2dd4bf; }
        .data { fill: #172554; stroke: #60a5fa; }
        .support { fill: #3b0764; stroke: #c084fc; }
        .title, .name { fill: #f8fafc; }
        .boundary-title, .copy, .edge-label { fill: #cbd5e1; }
        .tech { fill: #5eead4; }
        .arrow, .arrow-both { stroke: #94a3b8; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#64748b"/></marker>
  </defs>

  <rect class="bg" width="1400" height="850"/>
  <text class="title" x="48" y="55">컨테이너 구성</text>

  <rect class="external" x="45" y="180" width="205" height="110" rx="13"/>
  <text class="name" x="147" y="220" text-anchor="middle">구매자</text>
  <text class="copy" x="147" y="249" text-anchor="middle">인증된 사용자로</text>
  <text class="copy" x="147" y="270" text-anchor="middle">상품을 조회하고 구매</text>

  <rect class="external" x="45" y="430" width="205" height="110" rx="13"/>
  <text class="name" x="147" y="470" text-anchor="middle">판매자</text>
  <text class="copy" x="147" y="499" text-anchor="middle">판매 이벤트와</text>
  <text class="copy" x="147" y="520" text-anchor="middle">한정 재고를 준비</text>

  <rect class="boundary" x="305" y="100" width="790" height="660" rx="18"/>
  <text class="boundary-title" x="330" y="132">Limited Goods 시스템</text>

  <rect class="container" x="360" y="180" width="310" height="170" rx="15"/>
  <text class="name" x="515" y="220" text-anchor="middle">API 프로세스</text>
  <text class="tech" x="515" y="247" text-anchor="middle">Python 애플리케이션</text>
  <text class="copy" x="515" y="278" text-anchor="middle">조회, 구매 요청 조정,</text>
  <text class="copy" x="515" y="299" text-anchor="middle">결제 시도와 콜백 처리</text>
  <text class="copy" x="515" y="321" text-anchor="middle">sales · purchases</text>
  <text class="copy" x="515" y="340" text-anchor="middle">reservations · payments</text>

  <rect class="container" x="360" y="465" width="310" height="150" rx="15"/>
  <text class="name" x="515" y="505" text-anchor="middle">Worker 프로세스</text>
  <text class="tech" x="515" y="532" text-anchor="middle">동일한 Python 애플리케이션</text>
  <text class="copy" x="515" y="563" text-anchor="middle">점유 만료와</text>
  <text class="copy" x="515" y="584" text-anchor="middle">결제 결과 정합성 확인</text>

  <rect class="data" x="780" y="215" width="250" height="185" rx="15"/>
  <text class="name" x="905" y="255" text-anchor="middle">PostgreSQL</text>
  <text class="tech" x="905" y="282" text-anchor="middle">영속 상태의 기준</text>
  <text class="copy" x="905" y="313" text-anchor="middle">재고와 판매</text>
  <text class="copy" x="905" y="334" text-anchor="middle">주문과 점유</text>
  <text class="copy" x="905" y="355" text-anchor="middle">결제 시도와 제약 조건</text>

  <rect class="support" x="780" y="500" width="250" height="140" rx="15"/>
  <text class="name" x="905" y="540" text-anchor="middle">관측성</text>
  <text class="tech" x="905" y="567" text-anchor="middle">로그 · 메트릭 · 알림</text>
  <text class="copy" x="905" y="598" text-anchor="middle">요청·주문·결제 시도와</text>
  <text class="copy" x="905" y="619" text-anchor="middle">불변식 경고를 연결</text>

  <rect class="external" x="1160" y="275" width="200" height="150" rx="13"/>
  <text class="name" x="1260" y="315" text-anchor="middle">Mock PG</text>
  <text class="copy" x="1260" y="346" text-anchor="middle">결제 요청과 상태 조회,</text>
  <text class="copy" x="1260" y="367" text-anchor="middle">지연·실패·중복 결과를</text>
  <text class="copy" x="1260" y="388" text-anchor="middle">결정적으로 재현</text>

  <path class="arrow" d="M250 235 L360 235"/><text class="edge-label" x="273" y="218">HTTPS / JSON</text>
  <path class="arrow" d="M250 485 C300 485 315 315 360 300"/><text class="edge-label" x="265" y="410">판매 설정</text>
  <path class="arrow-both" d="M670 270 L780 270"/><text class="edge-label" x="694" y="253">트랜잭션</text>
  <path class="arrow-both" d="M670 510 C720 470 735 390 780 350"/><text class="edge-label" x="700" y="427">작업 / 상태</text>
  <path class="arrow" d="M610 350 C655 430 715 500 780 550"/><text class="edge-label" x="665" y="446">관측 데이터</text>
  <path class="arrow" d="M670 585 L780 585"/><text class="edge-label" x="698" y="568">관측 데이터</text>
  <path class="arrow-both" d="M670 235 C870 115 1070 190 1160 305"/><text class="edge-label" x="850" y="155">결제 요청 / 콜백</text>
  <path class="arrow-both" d="M670 610 C835 715 1055 720 1160 410"/><text class="edge-label" x="885" y="728">결제 상태 확인</text>
</svg>
