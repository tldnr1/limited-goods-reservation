spring:
  profiles:
    default: all
  application:
    name: limited-goods
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/limited_goods_dev}
    username: ${DB_USER:goods}
    password: ${DB_PASSWORD:local-only}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      connection-timeout: 1000
      connection-init-sql: "SET statement_timeout = '5s'"
      data-source-properties:
        ApplicationName: ${APP_INSTANCE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 200ms
      connect-timeout: 200ms
server:
  port: 8080
  tomcat:
    threads:
      max: ${HTTP_THREADS:40}
      min-spare: 4
    accept-count: ${HTTP_BACKLOG:40}
    max-connections: ${HTTP_CONNECTIONS:256}
management:
  endpoint.health.probes.enabled: true
  endpoints.web.exposure.include: health,prometheus
  metrics.distribution.percentiles-histogram.http.server.requests: true
app:
  hold-seconds: 300
  payment-window-seconds: 70
  admission:
    enabled: ${ADMISSION_ENABLED:false}
    namespace: ${REDIS_NAMESPACE:goods:dev:}
    permits: ${ADMISSION_PERMITS:8}
  worker:
    enabled: ${WORKER_ENABLED:false}
    idle-delay-ms: ${WORKER_IDLE_DELAY_MS:250}
    concurrency: ${WORKER_CONCURRENCY:4}
  pg-url: ${PG_URL:http://localhost:8081}
  pg-secret: ${PG_SECRET:local-pg-secret}
logging:
  level:
    com.limitedgoods.purchases.PurchaseTrace: ${PURCHASE_TIMING_LOG_LEVEL:OFF}
