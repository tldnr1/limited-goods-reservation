spring:
  application:
    name: limited-goods-reservation
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/limited_goods_reservation}
    username: ${SPRING_DATASOURCE_USERNAME:limited_goods}
    password: ${SPRING_DATASOURCE_PASSWORD:limited_goods}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      repositories:
        enabled: false
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always

stock:
  strategy: ${STOCK_STRATEGY:naive-rdb}

purchase:
  failure:
    mode: ${PURCHASE_FAILURE_MODE:off}
    limit: ${PURCHASE_FAILURE_LIMIT:0}

waiting-room:
  enabled: ${WAITING_ROOM_ENABLED:true}
  product-id: ${WAITING_ROOM_PRODUCT_ID:1}
  admission:
    scheduler-enabled: ${WAITING_ROOM_ADMISSION_SCHEDULER_ENABLED:true}
    batch-size: ${WAITING_ROOM_ADMISSION_BATCH_SIZE:20}
    active-capacity: ${WAITING_ROOM_ADMISSION_ACTIVE_CAPACITY:100}
    token-ttl-seconds: ${WAITING_ROOM_ACTIVE_TOKEN_TTL_SECONDS:60}
    interval-ms: ${WAITING_ROOM_ADMISSION_INTERVAL_MS:1000}
    retry-after-seconds: ${WAITING_ROOM_RETRY_AFTER_SECONDS:2}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        stock.decision.duration: true
        order.save.duration: true
        reservation.save.duration: true
      percentiles:
        stock.decision.duration: 0.5,0.95,0.99
        order.save.duration: 0.5,0.95,0.99
        reservation.save.duration: 0.5,0.95,0.99
